# Reference template: ~/web-server/duct-tape/compose.yaml.
# Paths are relative to that project directory; code lives in repo/.
# Existing production compose.yaml is the single operational source; do not overwrite it blindly.
name: duct-tape
services:
  duct-tape:
    build:
      context: ./repo
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./repo/.env
    environment:
      DUCT_AUTH_MODE: secure
      DUCT_DB_PATH: /data/monitoring.sqlite3
      DUCT_MEDIA_ROOT: /media
      TMPDIR: /work
    volumes:
      - ./data/db:/data
      - ./data/media:/media:ro
      - ./data/temp:/work
      - ./data/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
